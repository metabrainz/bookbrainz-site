# Run ESLint on pull requests (limited permissions)

name: Lint pull requests

# Controls when the action will run.
on:
  # Triggers the workflow on pull request events with fork-safe permissions.
  pull_request:

# Limit permissions of the token
# When running an untrusted fork, we don't want to give write permissions
# See https://securitylab.github.com/research/github-actions-preventing-pwn-requests/
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  run-linters-pull-request:
    name: Run linters for pull requests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run ESLint
        id: eslint
        run: yarn run lint --format json --output-file eslint_report.json
        continue-on-error: true

      - name: Upload ESLint report
        uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: eslint-report
          path: eslint_report.json

      - name: Fail on ESLint errors
        if: steps.eslint.outcome == 'failure'
        run: exit 1
